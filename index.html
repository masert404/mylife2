<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наше путешествие длиною в жизнь</title>
    <style>
        /* Подключаем шрифты Playfair Display и Montserrat */
        @import url('https://googleapis.com');
        
        :root { 
            --bg-color: #DCD1C4; 
            --text-color: #2F2C2A; 
            --accent-color: #8C6239; 
            --light-accent: #C4B5A5; 
            --card-bg: #F4EFE9; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            line-height: 1.6; 
            font-weight: 300; 
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
        }

        h1, h2, .motto, .welcome-title { font-family: 'Playfair Display', serif; }
        
        /* Главный контейнер заставки */
        .welcome-container {
            max-width: 800px;
            width: 100%;
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            /* Плавное проявление всей страницы при загрузке */
            animation: fadeInPage 1.5s ease-in-out forwards;
        }

        .welcome-title {
            font-size: 3rem;
            margin-bottom: 15px;
            font-style: italic;
            color: var(--text-color);
        }

        .motto {
            font-size: 1.1rem;
            color: var(--accent-color);
            margin-bottom: 50px;
            font-style: italic;
            letter-spacing: 0.05em;
        }

        /* Интерактивное навигационное меню в виде плитки */
        .portal-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 700px;
            margin-bottom: 40px;
        }

        .portal-card {
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 8px;
            border: 1px solid var(--light-accent);
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.02);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Эффект при наведении на карточку перехода */
        .portal-card:hover {
            transform: translateY(-5px);
            background-color: #FFFDFB;
            border-color: var(--accent-color);
            box-shadow: 0 15px 30px rgba(140, 98, 57, 0.08);
        }

        .portal-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-style: italic;
            margin-bottom: 8px;
            color: var(--accent-color);
            transition: color 0.3s;
        }

        .portal-card p {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #736960;
        }

        /* Анимация плавного появления */
        @keyframes fadeInPage {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Адаптивность для мобильных телефонов */
        @media (max-width: 600px) {
            .welcome-title { font-size: 2.2rem; }
            .portal-grid { grid-template-columns: 1fr; gap: 15px; }
            .portal-card { padding: 22px 15px; }
        }

        footer { 
            text-align: center; 
            padding: 25px 20px; 
            font-size: 0.8rem; 
            color: #59524C; 
            width: 100%;
            border-top: 1px solid rgba(196, 181, 165, 0.2); 
            letter-spacing: 0.05em; 
        }
    </style>
</head>
<body>

    <main class="welcome-container">
        <!-- Главное приветствие -->
        <h1 class="welcome-title">Наше путешествие длиною в жизнь</h1>
        <p class="motto">Пространство для двоих: воспоминания, дороги и смыслы</p>

        <!-- Интерактивные двери-карточки в другие разделы -->
        <div class="portal-grid">
            <a href="diary.html" class="portal-card">
                <h3>Главы</h3>
                <p>История & Кадры</p>
            </a>
            
            <a href="travel.html" class="portal-card">
                <h3>Дороги</h3>
                <p>Наши маршруты</p>
            </a>
            
            <a href="gallery.html" class="portal-card">
                <h3>Альбом</h3>
                <p>Интерактивные снимки</p>
            </a>
        </div>
    </main>

    <footer>
        <p>Только для нас двоих. Создано с любовью.</p>
    </footer>

</body>
</html>
